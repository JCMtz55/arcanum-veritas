<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Ephemer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="bar">
  <a class="home" href="./" title="Ephemer — back to the front page" aria-label="Ephemer home">★</a>
  <div class="brand">Admin<em>the DM's own</em></div>
  <div class="live">
    <span class="lv" id="pendingBox" hidden><b id="pendingOut">0</b><i>waiting</i></span>
    <details class="more" id="who" hidden>
      <summary class="mini" id="whoBtn" title="Your account"></summary>
      <div class="more-menu" onclick="this.parentNode.open = false">
        <button onclick="location.href='arcanum.html'">Seal composer</button>
        <button onclick="location.href='grimms/'">Grimm Companion</button>
        <button onclick="openAccount()">Change password</button>
        <button onclick="signOut()">Sign out</button>
      </div>
    </details>
  </div>
</div>

<div class="board" id="board" hidden>
  <aside class="rail">
    <div class="cogs" id="adminList" style="padding-top:11px"></div>
    <div class="rail-foot"><button class="ghost" onclick="openAdminUser('new')">New player</button></div>
  </aside>
  <section class="codex" id="adminBody"></section>
</div>

<!-- Shown to anyone who isn't the DM, instead of an interface that would fail on every click -->
<div class="board" id="locked" hidden>
  <section class="codex">
    <div class="cdx"><div class="cdx-hd"><div>
      <h1>Not yours to open</h1>
      <p class="cdx-desc" id="lockedWhy"></p>
    </div></div>
    <div class="cdx-sec"><div class="cdx-note">
      <p>The Admin page keeps the accounts, what each player may read, the Paragon paths and the Grimms.
         If you came looking for your own tools, they're on <a href="./">the front page</a>.</p>
    </div></div></div>
  </section>
</div>

<div class="gate" id="gate" hidden>
  <form class="gate-box" onsubmit="return signIn(event)">
    <h1>Admin</h1>
    <p>Sign in as the DM.</p>
    <label for="gateUser">Name</label>
    <input class="search" id="gateUser" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="gatePass">Password</label>
    <input class="search" id="gatePass" type="password" autocomplete="current-password" required>
    <p class="gate-err" id="gateErr" hidden></p>
    <button class="gate-go" type="submit">Sign in</button>
  </form>
</div>

<dialog class="acct" id="acct">
  <form onsubmit="return changePassword(event)">
    <h2 id="acctName"></h2>
    <label for="acctCur">Current password</label>
    <input class="search" id="acctCur" type="password" autocomplete="current-password" required>
    <label for="acctNew">New password</label>
    <input class="search" id="acctNew" type="password" autocomplete="new-password" minlength="8" required>
    <p class="gate-err" id="acctErr" hidden></p>
    <div class="acct-row">
      <button class="mini on" type="submit">Change password</button>
      <button class="mini" type="button" onclick="document.getElementById('acct').close()">Close</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<!-- Only what the DM's work needs: the domain tables and Ranks, the Grimm book, the worked
     Paragon sets. None of the builder — no composer, no card, no dice. -->
<script src="js/data.js"></script>
<script src="grimms/js/data.js"></script>
<script src="js/paragon-examples.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
