const CAT_ORDER = Object.keys(CATEGORIES);
function catOf(c) { return CATEGORIES[c?.category] ? c.category : null; }

// Cognition icons: a Font Awesome glyph (`fa` in index.json) tinted in the domain's colour.
// Until the icon font has actually loaded — or if it never does (offline, blocked CDN) —
// the emoji in `icon` is used instead, so nothing ever renders as an empty box.
let FA_READY = false;
function cogIcon(c) {
  if (FA_READY && c?.fa) return `<i class="fa-solid fa-${c.fa} dom-${catOf(c) || "none"}" aria-hidden="true"></i>`;
  return c?.icon || "◆";
}
function initIcons() {
  if (!document.fonts?.load) return;
  document.fonts.load('900 1em "Font Awesome 6 Free"').then(faces => {
    if (!faces.length) return;
    FA_READY = true;
    renderCogList(); renderCodexList(); renderMain();
    if (state.view === "codex") renderCodex();
  }).catch(() => {});
}

const ORDINALS = ["","1st","2nd","3rd","4th","5th","6th","7th","8th","9th"];

const TIERS = [
  { label:"Lv 1–4",   min:1,  max:4  },
  { label:"Lv 5–10",  min:5,  max:10 },
  { label:"Lv 11–16", min:11, max:16 },
  { label:"Lv 17+",   min:17, max:20 },
];

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let INDEX  = [];
let LOADED = {};

const state = {
  slotLevel:   1,   // spell slot (1–9) — controls cognition count
  charLevel:   1,   // character level (1–20) — controls tier
  core:        null,
  coreVerum:   null,
  compType:    null,
  compSub:     null,
  complements: [],  // [{id, compEffect}]
  verumMod:    4,
  dreamMod:    0,
  sumMode:     "play",    // "play" | "full"
  shape:       "sphere",   // for Rings flagged shape:true
  manner:      "standard", // Manners of Drawing
  view:        "composer", // "composer" | "codex" | "rings"
  codexId:     null,       // which cognition the Codex is reading
  ringRef:     null,       // {type, sub} — which Ring the Rings tab is reading
  filter:      null,       // domain filter, shared by both rails; null = all
};

// Which Verum / Complement pool a Ring draws from.
// A Cognition that defines its own `creation` / `utility` pool uses it; otherwise the Ring's
// fallback mapping applies (Structure/Object → control, Construct → offensive, Utility → supportive).
function poolFor(cog, type, sub) {
  const cd = COMP_DATA[type]; if (!cd) return type;
  if (cog?.verumEffects?.[type]?.length) return type;
  const s = cd.subtypes[sub];
  return (s && s.verumKey) || cd.verumKey || type;
}
function verumKey(cog) {
  return poolFor(cog || LOADED[state.core], state.compType, state.compSub);
}
// A Ring is only offered when the Core can actually fill it — its own pool, or the
// pool it falls back to. Subtypes of one family can resolve differently
// (Construct → offensive, Structure / Object → control), so each is checked on its own.
function subHasVerum(cog, type, sub) {
  return !!(cog?.verumEffects?.[poolFor(cog, type, sub)]?.length);
}
function availableSubs(cog, type) {
  return Object.keys(COMP_DATA[type]?.subtypes || {}).filter(sk => subHasVerum(cog, type, sk));
}
function availableRings(cog) {
  return Object.keys(COMP_DATA).filter(k => availableSubs(cog, k).length > 0);
}
function verumLabel(cog) { return COMP_DATA[verumKey(cog)]?.label || ""; }
// Complement effects: a native type ("Creation" / "Utility") wins; else the fallback pool's label
function complementPool(cog) {
  const native = COMP_DATA[state.compType]?.label || "";
  const list = cog?.complementEffects || [];
  const nat = list.filter(fx => fx.type.toLowerCase() === native.toLowerCase());
  if (nat.length) return nat;
  const fb = verumLabel().toLowerCase();
  return list.filter(fx => fx.type.toLowerCase() === fb);
}
// Complement budget: slot − 1, plus up to three from Coven Drawing
function maxComps() { return state.slotLevel - 1 + (state.manner === "coven" ? 3 : 0); }
function currentSub() { return COMP_DATA[state.compType]?.subtypes?.[state.compSub]; }
// ── Schema tolerance: a tier / effect may be a plain string (v1) or {text, card, mech} (v2)
function partText(p) { return (p && typeof p === "object") ? (p.text || "") : (p || ""); }
function partCard(p) { return (p && typeof p === "object") ? (p.card || null) : null; }
function partMech(p) { return (p && typeof p === "object") ? (p.mech || null) : null; }
// PLAY card prefers the authored card line; falls back to compressing the prose
function cardLine(p) {
  const c = partCard(p);
  return c ? resolve(c) : compact(resolve(partText(p)));
}
// Core tiers accumulate: everything up to the live tier applies, oldest first.
// A dice ladder is the exception — each tier restates the total — so when a later reached
// tier restates bonusDice, an earlier tier's "+N dice" lead is dropped rather than read as extra.
function coreLadder(av, tier) {
  const top = Math.min(tier, (av?.tiers?.length || 0) - 1), out = [];
  for (let i = 0; i <= top; i++) {
    let line = cardLine(av.tiers[i]);
    const restated = av.tiers.slice(i + 1, top + 1)
      .some(t => typeof partMech(t)?.damage?.bonusDice === "number");
    if (restated) line = line.replace(/^\s*\+\s*\d+\s*(?:dice|die)\b\s*(?:·\s*)?/i, "");
    if (line.trim()) out.push({ label: TIERS[i].label, line, now: i === top });
  }
  return out;
}
// ── Derived numbers ────────────────────────────────────────
function profBonus()  { return Math.ceil(state.charLevel / 4) + 1; }
function sealAttack() { return profBonus() + state.verumMod; }
function verumDC()    { return 8 + profBonus() + state.verumMod + state.dreamMod; }
function sgn(n)       { return (n >= 0 ? "+" : "") + n; }
// Resolve the formula shorthands the tables and effect text use
function resolve(str) {
  if (!str) return str;
  const vm = state.verumMod, pb = profBonus(), dc = verumDC();
  return String(str)
    .replace(/2\s*×\s*\{VM\}\s*\+\s*\{PB\}/g, `${2*vm + pb}`)
    .replace(/\{VM\}\s*\+\s*\{PB\}/g, `${vm + pb}`)
    .replace(/\{PB\}\s*\+\s*\{VM\}/g, `${vm + pb}`)
    .replace(/\{DC\}/g, `DC ${dc}`)
    .replace(/\{ATK\}/g, sgn(pb + vm))
    .replace(/\{VM\}/g, `${vm}`)
    .replace(/\{PB\}/g, `${pb}`)
    // multipliers of the Verum Modifier resolve to a real number
    .replace(/(\d+)\s*[×x]\s*VM\b/g, (m, n) => `${(+n) * vm}`)
    .replace(/\b(two|three|four|five|six|seven|eight|nine|ten)\s+times\s+your\s+Verum\s+Modifier/gi,
             (m, w) => `${({two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10})[w.toLowerCase()] * vm}`)
    // specific phrasings first, so the general ones can't mangle them
    .replace(/\(DC equals your Verum DC\)/gi, `(DC ${dc})`)
    .replace(/against your Verum DC/gi, `vs DC ${dc}`)
    .replace(/your Verum DC/gi, `DC ${dc}`)
    // the spellcasting modifier is the Verum Modifier in this system — resolve it outright
    .replace(/twice your spellcasting modifier \+ your proficiency bonus/gi, `${2*vm + pb}`)
    .replace(/your spellcasting modifier \+ your proficiency bonus/gi, `${vm + pb}`)
    .replace(/twice your spellcasting modifier/gi, `${2*vm}`)
    .replace(/your spellcasting modifier/gi, `${vm}`)
    .replace(/twice your (Strength|Dexterity|Constitution|Intelligence|Wisdom|Charisma) modifier \+ your proficiency bonus/gi, (m,a)=>`2×${a.slice(0,3)}+${pb}`)
    .replace(/your (Strength|Dexterity|Constitution|Intelligence|Wisdom|Charisma) modifier \+ your proficiency bonus/gi, (m,a)=>`${a.slice(0,3)}+${pb}`)
    .replace(/twice your proficiency bonus/gi, `${pb*2}`)
    .replace(/\+\s*your proficiency bonus/gi, `+${pb}`)
    .replace(/your proficiency bonus/gi, `${pb}`)
    .replace(/twice your Verum Modifier/gi, `${vm*2}`)
    .replace(/\+\s*your Verum Modifier/gi, `+${vm}`)
    .replace(/your Verum Modifier/gi, `${vm}`)
    .replace(/\s*\+\s*VM\b/g, sgn(vm))
    .replace(/\bVM\b/g, sgn(vm))
    .replace(/\+\s*\+/g, "+");
}
// Which upgrade lines are live at the current tier (upgrade i unlocks at tier i+1)
function liveUpgrades(ups, tier) { return (ups || []).slice(0, tier); }
// Heuristic: does this effect text hang off a saving throw, and which one?
const ABILITIES = ["Strength","Dexterity","Constitution","Intelligence","Wisdom","Charisma"];
function saveAbilityOf(text) {
  const m = String(text || "").match(new RegExp("\\b(" + ABILITIES.join("|") + ")\\s+(?:saving throw|save)", "i"));
  return m ? m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase() : null;
}
function setSumMode(m) { state.sumMode = m; renderMain(); }
function mannerAllowed(m, sub = state.compSub) {
  if (m === "rite")      return !(sub === "Ward" || sub === "Direct Attack");
  if (m === "inscribed") return sub !== "Ward";
  return true;
}

function getTier(charLvl) {
  const idx = TIERS.findIndex(t => charLvl >= t.min && charLvl <= t.max);
  return idx < 0 ? 3 : idx;
}


// Safe onclick helper — avoids quote-in-attribute issues
function escAttr(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

// ═══════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════
async function boot() {
  try {
    const r = await fetch("cognitions/index.json");
    if (!r.ok) throw new Error(r.status);
    INDEX = (await r.json()).cognitions;
    const ready = INDEX.filter(c => c.ready).length;
    setStatus("ok", `✓ ${ready} cognitions ready`);
    renderCogList();
    renderCodexList();
    syncBar();
    renderMain();
    const fa = document.getElementById("faCss");
    if (fa?.sheet) initIcons(); else fa?.addEventListener("load", initIcons);
  } catch(e) {
    console.error("Arcanum Veritas Builder boot error:", e);
    const isFetch = !INDEX.length;
    setStatus("err", isFetch ? "✗ cognitions/index.json not found" : "✗ render error — see console");
    const host = document.getElementById("composer");
    if (!host) return;
    host.innerHTML = isFetch ? `
      <div class="empty">
        <p><strong>Can't find the cognitions folder.</strong></p>
        <p>Keep this file next to a <code>cognitions/</code> folder containing <code>index.json</code>.</p>
        <p>If the folder is there, your browser is blocking <code>fetch()</code> on <code>file://</code> —
           open it through a local server (VS Code Live Server, or <code>python -m http.server</code>), or use Firefox.</p>
      </div>` : `
      <div class="empty">
        <p><strong>Something failed while drawing the page.</strong></p>
        <p>${String(e.message || e)}</p>
        <p>The browser console has the details.</p>
      </div>`;
  }
}

async function loadCognition(id) {
  if (LOADED[id]) return LOADED[id];
  try {
    const r = await fetch(`cognitions/${id}.json`);
    if (!r.ok) throw new Error(r.status);
    LOADED[id] = await r.json();
    return LOADED[id];
  } catch(e) {
    console.warn("Failed to load", id, e);
    return null;
  }
}


function setStatus(cls, msg) {
  const el = document.getElementById("statusEl");
  el.textContent = msg; el.className = "status " + cls;
}

// ═══════════════════════════════════════════════════════════
//  COMMAND BAR
// ═══════════════════════════════════════════════════════════
function bumpSlot(d) {
  state.slotLevel = Math.min(9, Math.max(1, state.slotLevel + d));
  state.complements = state.complements.slice(0, maxComps());
  syncBar(); renderCogList(); renderMain();
}
function bumpLvl(d) {
  state.charLevel = Math.min(20, Math.max(1, state.charLevel + d));
  syncBar(); renderMain();
}
function syncBar() {
  document.getElementById("slotVal").textContent = ORDINALS[state.slotLevel];
  document.getElementById("lvlVal").textContent  = state.charLevel;
  document.getElementById("atkOut").textContent  = sgn(sealAttack());
  document.getElementById("dcOut").textContent   = verumDC();
  const mc = maxComps(), have = state.complements.length + (state.core ? 1 : 0);
  document.getElementById("capOut").textContent = `${have}/${mc + 1}`;
  document.getElementById("capLbl").textContent =
    mc === 0 ? "core only" : (state.manner === "coven" ? "with coven" : "cognitions");
}

// ═══════════════════════════════════════════════════════════
//  COGNITION RAIL
// ═══════════════════════════════════════════════════════════
// Walk the domains in order, emitting a heading and then that domain's matches.
// `render` turns one index entry into a button; both rails share the scaffolding.
function groupedRail(q, render) {
  let shown = 0, h = "";
  CAT_ORDER.forEach(key => {
    if (state.filter && state.filter !== key) return;
    const rows = INDEX.filter(c => catOf(c) === key && (!q || c.name.toLowerCase().includes(q)));
    if (!rows.length) return;
    h += `<div class="grp ${key}">${CATEGORIES[key].label}<i></i></div>`;
    rows.forEach(c => { shown++; h += render(c); });
  });
  // Anything the data forgot to categorise still has to be reachable
  const loose = INDEX.filter(c => !catOf(c) && (!q || c.name.toLowerCase().includes(q)));
  if (loose.length && (!state.filter || state.filter === "__none")) {
    h += `<div class="grp">Uncategorised<i></i></div>`;
    loose.forEach(c => { shown++; h += render(c); });
  }
  return { shown, h };
}

function renderFilter(selId) {
  const sel = document.getElementById(selId);
  if (!sel) return;
  const n = {};
  INDEX.forEach(c => { const k = catOf(c); if (k) n[k] = (n[k] || 0) + 1; });
  const loose = INDEX.filter(c => !catOf(c)).length;
  // Labels stay short so the closed control doesn't truncate in a 218px rail;
  // the domain's gloss rides on the title instead.
  sel.innerHTML =
    `<option value="">All domains · ${INDEX.length}</option>` +
    CAT_ORDER.filter(k => n[k]).map(k =>
      `<option value="${k}">${esc(CATEGORIES[k].label)} · ${n[k]}</option>`
    ).join("") +
    (loose ? `<option value="__none">Uncategorised · ${loose}</option>` : "");
  sel.value = state.filter || "";
  sel.className = "pick" + (state.filter ? " " + state.filter : "");
  const cat = CATEGORIES[state.filter];
  sel.title = cat ? `${cat.label} — ${cat.note}` : "Filter the rail by domain";
}
function setFilter(k) {
  state.filter = k || null;
  renderCogList(); renderCodexList();
}

function renderCogList() {
  const box = document.getElementById("cogList");
  if (!box) return;
  renderFilter("cogFilter");
  const q = (document.getElementById("cogSearch")?.value || "").trim().toLowerCase();
  const atCap = state.complements.length >= maxComps() && state.core !== null;
  const { shown, h } = groupedRail(q, c => {
    const isCore = state.core === c.id;
    const isComp = state.complements.some(x => x.id === c.id);
    const off = !c.ready || (!isCore && !isComp && atCap);
    const cls = isCore ? "core" : isComp ? "comp" : off ? "off" : "";
    const role = isCore ? "core" : isComp ? "sigil" : "";
    return `<button class="cog ${cls}" ${off && !isCore && !isComp ? "disabled" : ""}
      onclick="toggleCog('${escAttr(c.id)}')" title="${c.ready ? c.name : c.name + " — not written yet"}">
      <span class="ico">${cogIcon(c)}</span><span class="nm">${c.name}</span>
      ${c.favorite ? `<span class="cos" title="Player favourite — held to a higher power bar">★</span>` : ""}
      ${role ? `<span class="rl">${role}</span>` : ""}</button>`;
  });
  box.innerHTML = shown ? h : `<div class="empty" style="padding:22px 8px">${emptyRail(q)}</div>`;
}

function emptyRail(q) {
  const f = state.filter ? (CATEGORIES[state.filter]?.label || "Uncategorised") : null;
  if (q && f)  return `No ${f} cognition matches “${esc(q)}”.`;
  if (q)       return `No cognition matches “${esc(q)}”.`;
  return `Nothing in ${f || "this filter"}.`;
}

// ═══════════════════════════════════════════════════════════
//  COMPOSER
// ═══════════════════════════════════════════════════════════
function block(title, body) {
  return `<div class="blk"><div class="blk-h"><h2>${title}</h2><div class="rule"></div></div>${body}</div>`;
}

function renderMain() {
  const comp = document.getElementById("composer");
  const seal = document.getElementById("sumBody");
  syncBar();
  // Codex and Rings resolve formulas off the same bar, so they re-read whenever it moves
  if (state.view === "codex") renderCodex();
  if (state.view === "rings") renderRing();

  if (!state.core) {
    comp.innerHTML = rulesDrawer() + `<div class="empty">
      Pick a cognition from the left to set your Keystone. Everything else follows from it.</div>`;
    seal.innerHTML = `<div class="empty">No seal drawn yet.</div>`;
    return;
  }

  const coreCog = LOADED[state.core];
  const tier    = getTier(state.charLevel);
  comp.innerHTML = rulesDrawer() + buildComposer(coreCog, tier);

  if (!state.compType || !state.compSub || !currentSub()) {
    seal.innerHTML = `<div class="empty">Choose a Ring to draw the seal.</div>`;
    seal.dataset.text = "";
  } else {
    seal.innerHTML = state.sumMode === "play"
      ? buildPlayCardHTML(coreCog, tier)
      : `<div class="raw">${buildFullRef(coreCog, tier).join("\n")}</div>`;
    seal.dataset.text = buildPlayCard(coreCog, tier).join("\n");
  }
  document.getElementById("mPlay").className = "mini" + (state.sumMode === "play" ? " on" : "");
  document.getElementById("mFull").className = "mini" + (state.sumMode === "full" ? " on" : "");
}

function buildComposer(coreCog, tier) {
  const cd  = COMP_DATA[state.compType];
  const sub = currentSub();
  let h = "";

  // Ring family — only the ones this Core can fill
  const rings = availableRings(coreCog);
  if (!rings.length) {
    return block("Ring — what shape the seal takes",
      `<p class="hint">${esc(INDEX.find(c => c.id === state.core)?.name || "This cognition")}
       has no Verum effects written yet, so it can't take a Ring.</p>`);
  }
  h += block("Ring — what shape the seal takes", `<div class="rings">` +
    rings.map(k => {
      const d = COMP_DATA[k];
      return `<button class="ring ${k}${state.compType === k ? " on" : ""}" onclick="selectCompType('${k}')">
        <b>${d.label}</b><span>${d.desc}</span></button>`;
    }).join("") + `</div>`);

  if (!state.compType) return h;

  // Subtype — likewise, only the ones with a pool behind them
  const subs = availableSubs(coreCog, state.compType);
  h += block("Subtype", `<div class="chips">` +
    subs.map(sk =>
      `<button class="chip${state.compSub === sk ? " on" : ""}" onclick="selectCompSub('${escAttr(sk)}')">${sk}</button>`
    ).join("") + `</div>`);

  if (!state.compSub || !sub) return h;

  // Shape + Manner side by side
  let opts = "";
  if (sub.shape) opts += `<div><div class="blk-h"><h2>Shape</h2><div class="rule"></div></div>
    <div class="chips">${Object.entries(SHAPES).map(([k, sh]) =>
      `<button class="chip${state.shape === k ? " on" : ""}" onclick="selectShape('${k}')">${sh.label}</button>`).join("")}</div>
    <p class="hint">${SHAPES[state.shape].desc}</p></div>`;
  opts += `<div><div class="blk-h"><h2>Manner of drawing</h2><div class="rule"></div></div>
    <div class="chips">${Object.entries(MANNERS).map(([k, m]) =>
      `<button class="chip${state.manner === k ? " on" : ""}${mannerAllowed(k) ? "" : " dis"}" onclick="selectManner('${k}')">${m.label}</button>`).join("")}</div>
    <p class="hint">${MANNERS[state.manner].desc}</p></div>`;
  h += `<div class="blk grid2">${opts}</div>`;

  // Verum effect + the tier ladder
  const verums = coreCog?.verumEffects?.[verumKey()] || [];
  if (verums.length) {
    let v = "";
    if (verums.length > 1) v += `<div class="chips" style="margin-bottom:9px">` + verums.map(e =>
      `<button class="chip${state.coreVerum === e.name ? " on" : ""}" onclick="selectCoreVerum('${escAttr(e.name)}')">${e.name}</button>`).join("") + `</div>`;
    const av = verums.find(e => e.name === state.coreVerum) || verums[0];
    v += `<div class="vname">${av.name}</div>` +
         `<p class="hint" style="margin:0 0 9px">${av.description || ""}</p><div class="ladder">` +
      av.tiers.map((t, i) => i > tier ? "" :
        `<div class="rung ${i === tier ? "now" : "past"}"><span class="lv">${TIERS[i].label}</span>
         <span>${resolve(partText(t))}</span></div>`).join("") + `</div>`;
    h += block(`Verum effect — ${verumLabel()} pool`, v);
  } else {
    h += block("Verum effect", `<p class="hint">${INDEX.find(c=>c.id===state.core)?.name} has no ${verumLabel()} effect yet.</p>`);
  }

  // Scaling — the whole ladder, current slot lit
  const row = sub.rows.find(r => r[0] === ORDINALS[state.slotLevel]);
  let sc = `<div class="scale">` + sub.rows.map(r =>
    `<button class="sl${r[0] === ORDINALS[state.slotLevel] ? " on" : ""}" onclick="bumpSlotTo(${ORDINALS.indexOf(r[0])})">
      <b>${r[0]}</b><span>${resolve(r[1])}</span></button>`).join("") + `</div>`;
  if (row) sc += `<p class="scale-note">` + sub.columns.map((c, i) => `${c}: <strong>${resolve(row[i])}</strong>`).join(" · ") + `</p>`;
  if (sub.notes) sc += `<p class="scale-note" style="font-style:italic">${sub.notes.split("\n")[0]}</p>`;
  h += block(`${state.compSub} — scaling`, sc);

  // Complements
  if (maxComps() > 0) {
    let c = "";
    state.complements.forEach((cs, idx) => {
      const cog = LOADED[cs.id], entry = INDEX.find(x => x.id === cs.id);
      if (!cog || !entry) return;
      const avail = complementPool(cog);
      if (avail.length && !avail.find(f => f.name === cs.compEffect)) cs.compEffect = avail[0].name;
      const fx = avail.find(f => f.name === cs.compEffect) || avail[0];
      const coven = idx >= state.slotLevel - 1;
      c += `<div class="cmp"><div class="cmp-h"><span class="ico">${cogIcon(entry)}</span><b>${entry.name}</b>
        <span class="tag">${coven ? "coven sigil" : "sigil " + (idx + 1)}</span></div>`;
      if (!fx) {
        c += `<div class="cmp-b"><span class="hint">No ${verumLabel()} complement for ${entry.name} yet.</span></div></div>`;
        return;
      }
      if (avail.length > 1) c += `<div class="cmp-b" style="padding-bottom:0"><div class="chips">` +
        avail.map(f => `<button class="chip${f.name === cs.compEffect ? " on" : ""}" onclick="selectCompEffect(${idx},'${escAttr(f.name)}')">${f.name}</button>`).join("") + `</div></div>`;
      c += `<div class="cmp-b">${resolve(partText(fx.effect))}` +
        liveUpgrades(fx.upgrades, tier).map(u => `<span class="cmp-up">${resolve(partText(u))}</span>`).join("") + `</div></div>`;
    });
    const free = maxComps() - state.complements.length;
    if (free > 0) c += `<p class="hint">${free} more sigil${free > 1 ? "s" : ""} available — add from the list on the left.</p>`;
    h += block("Sigils", c || `<p class="hint">No sigils yet. Add up to ${maxComps()} from the list on the left.</p>`);
  }
  return h;
}

function bumpSlotTo(n) {
  state.slotLevel = n;
  state.complements = state.complements.slice(0, maxComps());
  syncBar(); renderCogList(); renderMain();
}

function rulesDrawer() {
  return `<details class="rules"><summary>Rules of the seal</summary><div class="rules-b">
    <h3>Numbers</h3><ul>${RULES.numbers.map(([k, v]) => `<li><strong>${k}</strong> — ${v}</li>`).join("")}</ul>
    <p class="prem">${RULES.premium}</p>
    <h3>Limits</h3><ul>${RULES.limits.map(x => `<li>${x}</li>`).join("")}</ul>
    <h3>Countering</h3><ul>${RULES.countering.map(x => `<li>${x}</li>`).join("")}</ul>
  </div></details>`;
}

// ═══════════════════════════════════════════════════════════
//  SELECTION
// ═══════════════════════════════════════════════════════════
async function toggleCog(id) {
  const entry = INDEX.find(c => c.id === id);
  if (!entry || !entry.ready) return;

  if (state.core === id) {
    // Deselect core → reset everything
    state.core = null; state.coreVerum = null;
    state.compType = null; state.compSub = null; state.complements = [];
  } else if (state.complements.some(x => x.id === id)) {
    // Remove complement
    state.complements = state.complements.filter(x => x.id !== id);
  } else if (!state.core) {
    // Set as core — always allowed
    await loadCognition(id);
    state.core = id;
    state.coreVerum = null;
    state.compType = null; state.compSub = null; state.complements = [];
  } else {
    // Add complement if slot allows
    if (state.complements.length >= maxComps()) return;
    await loadCognition(id);
    state.complements.push({ id, compEffect: null });
  }

  renderCogList();
  renderMain();
}

function clearAll() {
  state.core = null; state.coreVerum = null;
  state.compType = null; state.compSub = null; state.complements = [];
  renderCogList(); renderMain();
}

// ═══════════════════════════════════════════════════════════
//  COMPOSITION SELECTION
// ═══════════════════════════════════════════════════════════
function selectCompType(type) {
  const coreCog0 = LOADED[state.core];
  state.compType = type;
  state.compSub  = availableSubs(coreCog0, type)[0] || Object.keys(COMP_DATA[type].subtypes)[0];
  state.complements = state.complements.map(c => ({ ...c, compEffect: null }));
  // Auto-select first verum effect for this composition type (pure state, not in render)
  state.shape = "sphere";
  if (!mannerAllowed(state.manner)) state.manner = "standard";
  const coreCog = LOADED[state.core];
  const effects = coreCog?.verumEffects?.[verumKey()] || [];
  state.coreVerum = effects.length > 0 ? effects[0].name : null;
  renderMain();
}

function selectCompSub(sub) {
  state.compSub = sub;
  state.shape = "sphere";
  if (!mannerAllowed(state.manner)) state.manner = "standard";
  const coreCog = LOADED[state.core];
  const effects = coreCog?.verumEffects?.[verumKey()] || [];
  if (!effects.find(e => e.name === state.coreVerum)) state.coreVerum = effects.length ? effects[0].name : null;
  renderMain();
}

function selectShape(sh)  { state.shape = sh; renderMain(); }
function selectManner(m)  {
  if (!mannerAllowed(m)) return;
  state.manner = m;
  state.complements = state.complements.slice(0, maxComps());
  syncBar(); renderCogList(); renderMain();
}

function selectCoreVerum(name) {
  state.coreVerum = name;
  renderMain();
}

function selectCompEffect(idx, name) {
  state.complements[idx].compEffect = name;
  renderMain();
}

// ═══════════════════════════════════════════════════════════
//  MAIN RENDER
// ═══════════════════════════════════════════════════════════
// ─── Gather every complement's live text. One Seal, One Roll: Sigils never add their own save.
function gatherRiders(tier) {
  const riders = [], missing = [];
  state.complements.forEach(cs => {
    const cog   = LOADED[cs.id];
    const name  = INDEX.find(c => c.id === cs.id)?.name || cs.id;
    const avail = complementPool(cog);
    const fx    = avail.find(f => f.name === cs.compEffect) || avail[0];
    if (!fx) { missing.push(name); return; }
    riders.push({ name, fxName: fx.name, parts: [fx.effect, ...liveUpgrades(fx.upgrades, tier)] });
  });
  return { riders, missing };
}

// Trim an upgrade line's "Level 5+:" prefix — the card already filters by tier
function stripLvl(t) { return String(t).replace(/^\s*Level\s+\d+\+\s*:\s*/i, ""); }

// The section header already says when a rider fires, so drop the lead-in boilerplate
const LEAD_INS = [
  /^On a hit or failed saving throw against the primary effect,\s*/i,
  /^On a hit or failed save against the primary effect\s*[—–,]\s*/i,
  /^On a hit or failed save against the primary effect,\s*/i,
  /^When the primary effect hits or a target fails their save,\s*/i,
  /^On a hit or failed saving throw,\s*/i,
  /^When the primary effect hits or a target fails their saving throw,\s*/i,
  /^When the primary effect deals damage,\s*/i,
  /^When the primary effect resolves,\s*/i,
  /^On a failed save(?:ing throw)?,\s*/i,
];
function stripLead(t) {
  let out = String(t);
  for (const re of LEAD_INS) out = out.replace(re, "");
  return out.charAt(0).toUpperCase() + out.slice(1);
}
// Drop a trailing em-dash clause only when it carries no rules content (pure flavor)
const RULES_WORDS = /\d|\bd\d|advantage|disadvantage|save|saving|DC|damage|cannot|can't|must|immune|resist|condition|speed|feet|ft\b|round|turn|minute|hour|action|reaction|restrained|prone|frightened|stunned|paralyzed|blinded|charmed|poisoned|HP|hit point/i;
function stripFlavorTail(t) {
  const m = String(t).match(/^([\s\S]*?)\s*[—–]\s*([^—–]+)$/);
  if (!m) return t;
  const tail = m[2].trim();
  if (tail.length < 80 && !RULES_WORDS.test(tail)) return m[1].trim();
  return t;
}
// The die size of the current Ring row, so "one damage die of the primary effect's type" resolves
function primaryDie() {
  const sub = currentSub(); if (!sub) return null;
  const row = sub.rows.find(r => r[0] === ORDINALS[state.slotLevel]); if (!row) return null;
  for (const col of ["Damage","Damage / turn","Weapon Die","Healing","Healing / Target","Absorb"]) {
    const i = sub.columns.indexOf(col);
    if (i >= 0) { const m = String(row[i]).match(/d(\d+)/); if (m) return "d" + m[1]; }
  }
  return null;
}
const WORDNUM = { one:1, two:2, three:3, four:4, five:5 };
function resolveDice(t) {
  const die = primaryDie(); if (!die) return t;
  return String(t)
    .replace(/\b(one|two|three|four|five)\s+(?:additional\s+)?damage\s+(?:die|dice)\s+of\s+the\s+primary\s+effect'?s?\s+type(\s*\(min(?:imum)?\s*\d+d\d+\))?/gi,
             (m, w) => `${WORDNUM[w.toLowerCase()]}${die}`)
    .replace(/\bincreases?\s+to\s+(one|two|three|four|five)\s+dice\b/gi,
             (m, w) => `increases to ${WORDNUM[w.toLowerCase()]}${die}`);
}
// The SAVES header already states the DC and each line is labelled with its ability
function stripSaveBoiler(t) {
  return String(t)
    .replace(/^(?:the target\s+|they\s+|creatures?\s+)?(?:must\s+)?succeeds?\s+on\s+an?\s+[A-Z][a-z]+\s+(?:saving throw|save)\s+vs\s+DC\s*\d+\s+or\s+/i, "Fail: ")
    .replace(/[,—–]?\s*(?:the target|they|it)\s+must\s+succeeds?\s+on\s+an?\s+[A-Z][a-z]+\s+(?:saving throw|save)\s+vs\s+DC\s*\d+\s+or\s+/i, " — fail: ")
    .replace(/\s+vs\s+DC\s*\d+/gi, "");
}
function compact(t) {
  let out = stripFlavorTail(stripLead(stripLvl(t)));
  out = resolveDice(out);
  out = stripSaveBoiler(out);
  out = foldSigilSave(out);
  return out.replace(/\s+/g, " ").trim();
}
// One Seal, One Roll — a Sigil's own saving throw folds into the seal's single roll
function foldSigilSave(t) {
  return String(t)
    .replace(/on a failed\s+[A-Z][a-z]+\s+(?:saving throw|save)/gi, "on the failed save")
    .replace(/(?:the target |they |it )?must succeeds?\s+on an?\s+[A-Z][a-z]+\s+(?:saving throw|save)\s+or\s+/gi, "on a failed save, ")
    .replace(/succeeds?\s+on an?\s+[A-Z][a-z]+\s+(?:saving throw|save)/gi, "succeed on the save")
    .replace(/\bthey succeeds\b/gi, "they succeed")
    .replace(/([.!?]\s+)(on the failed save)/g, (m, p, r) => p + r.charAt(0).toUpperCase() + r.slice(1));
}

function buildPlayCard(coreCog, tier) {
  const coreEntry = INDEX.find(c => c.id === state.core);
  const cd  = COMP_DATA[state.compType];
  const sub = cd.subtypes[state.compSub];
  const L   = [];

  const scaleRow = sub.rows.find(r => r[0] === ORDINALS[state.slotLevel]);
  const cell = (col) => {
    const i = sub.columns.indexOf(col);
    return i >= 0 && scaleRow ? resolve(scaleRow[i]) : null;
  };

  // ── Header
  const bits = [`${ORDINALS[state.slotLevel]} slot`, `Char Lv ${state.charLevel}`];
  if (sub.shape) bits.push(SHAPES[state.shape].label);
  if (state.manner !== "standard") bits.push(MANNERS[state.manner].label);
  if (sub.concentration) bits.push("Concentration");
  if (sub.reaction) bits.push("REACTION");
  if (sub.saveDisadvantage) bits.push("first save at DISADVANTAGE");
  L.push(`${(coreEntry?.name || "—").toUpperCase()} · ${cd.label} — ${state.compSub}`);
  L.push(bits.join(" · "));

  // ── The one line of math that matters
  const stat = [];
  const dmg = cell("Damage") || cell("Damage / turn") || cell("Healing") || cell("Healing / Target") || cell("Absorb");
  if (state.compSub === "Direct Attack") stat.push(`Attack ${sgn(sealAttack())}`);
  if (dmg) {
    const kind = (cell("Healing") || cell("Healing / Target")) ? "healing"
               : cell("Absorb") ? "absorbed"
               : (coreCog?.damageType || "damage").toLowerCase();
    const { head, other } = damageLedger(dmg, coreCog, tier, kind);
    stat.push(`${head} ${kind}`);
    other.forEach(s => stat.push(`+${s.count}${s.die} ${s.type || kind} (${s.source})`));
    const doom = doomOf(coreCog, tier), roll = doomRoll(head, doom);
    if (roll) stat.push(`Doom ${roll} ${doom.type || kind} (${doom.when || "later"})`);
  }
  ["Range","Radius","Targets","Duration","Buff Duration","Zone Duration","Weapon Die","CR cap","Size","AC","HP / segment","Max size","Quality","Tier","Scope"]
    .forEach(c => { const v = cell(c); if (v) stat.push(`${c}: ${v}`); });
  if (coreCog?.savingThrow && state.compSub !== "Direct Attack")
    stat.push(`${coreCog.savingThrow} save DC ${verumDC()}`);
  L.push(stat.join(" · "));
  if (coreCog?.cost) L.push(`COST — ${cardLine(coreCog.cost)}`);
  L.push("");

  // ── Core Verum: every tier reached, oldest first (they accumulate)
  const coreVerums  = coreCog?.verumEffects?.[verumKey()] || [];
  const activeVerum = coreVerums.find(v => v.name === state.coreVerum) || coreVerums[0];
  if (activeVerum) {
    L.push(`CORE — ${(activeVerum.name || "").toUpperCase()}${tier > 0 ? "  (tiers stack; a bigger number replaces a smaller one)" : ""}`);
    coreLadder(activeVerum, tier).forEach(r => L.push(`  ${r.now ? "▸" : "·"} ${r.label}: ${r.line}`));
    L.push("");
  }

  // ── Riders — all resolve off the seal's single roll
  const { riders, missing } = gatherRiders(tier);
  const isAttack = state.compSub === "Direct Attack";
  if (riders.length) {
    L.push(isAttack
      ? "ON HIT — the attack roll is the only d20"
      : `ON A FAILED ${(coreCog?.savingThrow || "—").toUpperCase()} SAVE — DC ${verumDC()}, the only d20`);
    riders.forEach(e => {
      L.push(`  [${e.name}] ${cardLine(e.parts[0])}`);
      e.parts.slice(1).forEach(p => L.push(`      ↑ ${cardLine(p)}`));
    });
    L.push(`  (Sigil conditions last until the end of the target's next turn)`);
    L.push("");
  }
  if (missing.length) L.push(`(no ${verumLabel()} complement defined: ${missing.join(", ")})`);

  return L;
}

function esc(t){ return String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

// Chips derived from the mech layer of everything in play
function collectTags(coreCog, tier) {
  const conds = new Set(), denies = new Set();
  let resource = null;
  const push = (p) => {
    const m = partMech(p); if (!m) return;
    (m.conditions || []).forEach(c => c.name && conds.add(c.name));
    (m.deny || []).forEach(d => denies.add(d));
    if (m.resource?.name) resource = m.resource.name;
  };
  const cv = coreCog?.verumEffects?.[verumKey()] || [];
  const av = cv.find(v => v.name === state.coreVerum) || cv[0];
  if (av) for (let i = 0; i <= tier; i++) push(av.tiers[i]);
  gatherRiders(tier).riders.forEach(e => e.parts.forEach(push));
  return { conds: [...conds], denies: [...denies], resource };
}

// A Core tier that adds dice adds them to the Ring's damage — show the resulting total
function totalDamage(baseCell, coreCog, tier) {
  if (!baseCell) return null;
  const m = String(baseCell).match(/^(\d+)d(\d+)(.*)$/);
  if (!m) return baseCell;
  let n = +m[1]; const die = m[2], rest = m[3] || "";
  const cv = coreCog?.verumEffects?.[verumKey()] || [];
  const av = cv.find(v => v.name === state.coreVerum) || cv[0];
  let bonus = 0;
  if (av) for (let i = 0; i <= tier; i++) {
    const b = (partMech(av.tiers[i]) || {}).damage?.bonusDice;
    if (typeof b === "number") bonus = b;   // tiers restate the total, they don't stack
  }
  if (!bonus) return baseCell;
  return { total: `${n + bonus}d${die}${rest}`, base: `${n}d${die}`, bonus: `+${bonus}d${die}` };
}

// A Sigil adds to the seal's own damage only when its live line leads with "+N die(s)" —
// that is the shorthand for dice of the Ring's primary die. Everything else a Complement
// does (bleed ticks, terrain, per-turn ramps, riders on later turns) resolves on its own
// clock and must NOT be folded into the number you roll on the hit.
// Later live parts restate the total rather than stacking, exactly like Core tiers.
function sigilDamage(tier) {
  const die = primaryDie(); if (!die) return [];
  const baseSize = +die.slice(1);
  const out = [];
  gatherRiders(tier).riders.forEach(e => {
    let count = 0, type = null, minSize = 0;
    e.parts.forEach((p, i) => {
      const md = (partMech(p) || {}).damage || {};
      const d0 = Array.isArray(md.dice) ? md.dice[0] : md.dice;
      const dm = d0 && String(d0).match(/^(\d+)d(\d+)$/);
      // The "(min 1d6)" floor is authored on the base effect. A later upgrade's mech.damage
      // may describe something else entirely — collision damage, a tick — so don't read it.
      if (dm && i === 0) minSize = +dm[2];
      const m = String(partCard(p) || compact(partText(p)))
        .match(/^\s*\+\s*(\d+)\s*(?:dice|die)\b\s*([A-Za-z]+)?/i);
      if (m) {
        count = +m[1];
        const word = m[2] && !/^(of|and|to|on|per)$/i.test(m[2]) ? m[2].toLowerCase() : null;
        if (word) type = word;                       // a type named in the card lead always wins
        else if (!type && md.type) type = md.type;   // otherwise the first declaration stands
      }
    });
    if (count) out.push({ source: e.name, count, die: "d" + Math.max(baseSize, minSize), type });
  });
  return out;
}
// A Doom is the seal's damage coming back later, carrying extra dice of the Ring's die.
// Tiers accumulate, so later `doom` fields override earlier ones key by key.
function doomOf(coreCog, tier) {
  const cv = coreCog?.verumEffects?.[verumKey()] || [];
  const av = cv.find(v => v.name === state.coreVerum) || cv[0];
  let d = null;
  if (av) for (let i = 0; i <= tier && i < av.tiers.length; i++) {
    const m = partMech(av.tiers[i])?.doom;
    if (m) d = { ...d, ...m };
  }
  return d && d.extraDice ? d : null;
}
// What the Doom will land, written the way you'd roll it
function doomRoll(head, d) {
  const die = primaryDie(); if (!die || !d) return null;
  const m = String(head).match(/^(\d+)d(\d+)(.*)$/);
  if (d.share === "half" || !m) return `½ the hit +${d.extraDice}${die}`;
  return `${+m[1] + d.extraDice}d${m[2]}${m[3]}`;
}

// "Cognitive Fire" and "fire" are the same damage for the purpose of one total
function sameType(a, b) {
  const n = s => String(s || "").toLowerCase().replace(/^cognitive\s+/, "").trim();
  return n(a) === n(b);
}
// Fold the Sigil dice that share the headline's die and type into it; hand back the rest
function damageLedger(headCell, coreCog, tier, kind) {
  const t = totalDamage(headCell, coreCog, tier);
  let head = (t && typeof t === "object") ? t.total : (t || headCell);
  const bits = (t && typeof t === "object") ? [t.base, t.bonus] : [];
  const other = [];
  sigilDamage(tier).forEach(s => {
    const hm = String(head).match(/^(\d+)d(\d+)(.*)$/);
    if (hm && s.die === "d" + hm[2] && sameType(s.type, kind)) {
      if (!bits.length) bits.push(`${hm[1]}d${hm[2]}`);
      bits.push(`+${s.count}d${hm[2]}`);
      head = `${+hm[1] + s.count}d${hm[2]}${hm[3]}`;
    } else other.push(s);
  });
  return { head, bits, other };
}

function buildPlayCardHTML(coreCog, tier) {
  const coreEntry = INDEX.find(c => c.id === state.core);
  const cd  = COMP_DATA[state.compType];
  const sub = cd.subtypes[state.compSub];
  const isAttack = state.compSub === "Direct Attack";

  const row  = sub.rows.find(r => r[0] === ORDINALS[state.slotLevel]);
  const cell = (c) => { const i = sub.columns.indexOf(c); return i >= 0 && row ? resolve(row[i]) : null; };

  // The numbers you roll, largest first
  let nums = "";
  if (isAttack) nums += `<span class="n atk"><b>${sgn(sealAttack())}</b><i>to hit</i></span>`;
  if (coreCog?.savingThrow)
    nums += `<span class="n dc"><b>${verumDC()}</b><i>${esc(coreCog.savingThrow)} save</i></span>`;
  const dmgCell = cell("Damage") || cell("Damage / turn") || cell("Healing") || cell("Healing / Target") || cell("Absorb");
  if (dmgCell) {
    const kind = (cell("Healing") || cell("Healing / Target")) ? "healing"
               : cell("Absorb") ? "absorbed"
               : (coreCog?.damageType || "damage").toLowerCase();
    const { head, bits, other } = damageLedger(dmgCell, coreCog, tier, kind);
    nums += `<span class="n dmg"><b>${esc(head)}</b><i>${esc(kind)}</i>` +
            (bits.length ? `<u>${esc(bits.join(" "))}</u>` : "") + `</span>`;
    // Sigil dice of a different type stay their own number — resistance cares
    other.forEach(s => nums += `<span class="n dmg"><b>+${s.count}${esc(s.die)}</b>` +
      `<i>${esc(s.type || kind)}</i><u>${esc(s.source)}</u></span>`);
    // Damage that comes back later gets its own chip, with when it lands
    const doom = doomOf(coreCog, tier), roll = doomRoll(head, doom);
    if (roll) nums += `<span class="n dmg"><b>${esc(roll)}</b><i>doom · ${esc(doom.type || kind)}</i>` +
      `<u>${esc(doom.when || "later")}</u></span>`;
  }
  [["Range","range"],["Radius","radius"],["Targets","targets"],["Duration","duration"],
   ["Buff Duration","duration"],["Zone Duration","zone"],["Weapon Die","weapon die"],
   ["CR cap","CR"],["Size","size"],["HP / segment","HP each"],["Max size","size"],["Tier","tier"]]
   .forEach(([c,lab]) => { const v = cell(c); if (v) nums += `<span class="n"><b>${esc(v)}</b><i>${lab}</i></span>`; });

  const { conds, denies, resource } = collectTags(coreCog, tier);
  let tags = "";
  if (sub.reaction)      tags += `<span class="t hot">reaction</span>`;
  if (sub.concentration) tags += `<span class="t hot">concentration</span>`;
  if (sub.saveDisadvantage) tags += `<span class="t hot">first save at disadvantage</span>`;
  if (sub.shape && state.shape !== "sphere") tags += `<span class="t">${SHAPES[state.shape].label.toLowerCase()}</span>`;
  if (state.manner !== "standard")           tags += `<span class="t">${MANNERS[state.manner].label.toLowerCase()}</span>`;
  if (resource) tags += `<span class="t">${esc(resource)}</span>`;
  conds.forEach(c  => tags += `<span class="t hot">${esc(c.toLowerCase())}</span>`);
  denies.forEach(d => tags += `<span class="t">no ${esc(d)}</span>`);

  let h = `<div class="card">
    <div class="c-name">${esc(coreEntry?.name || "—")}</div>
    <div class="c-sub">${esc(cd.label)} ${esc(state.compSub)} · ${ORDINALS[state.slotLevel]} slot · level ${state.charLevel}</div>
    <div class="c-nums">${nums}</div>
    ${tags ? `<div class="c-tags">${tags}</div>` : ""}
    ${coreCog?.cost ? `<div class="c-cost">${esc(cardLine(coreCog.cost))}</div>` : ""}`;

  const cv = coreCog?.verumEffects?.[verumKey()] || [];
  const av = cv.find(v => v.name === state.coreVerum) || cv[0];
  if (av) {
    const lbl = tier > 0 ? "Core verum — every tier reached applies; a bigger number replaces a smaller one" : "Core verum";
    h += `<div class="c-sec"><div class="c-lbl">${lbl}</div><div class="c-core"><b>${esc(av.name)}</b>` +
      coreLadder(av, tier).map(r =>
        `<div class="c-tier${r.now ? " now" : ""}"><span class="c-tl">${esc(r.label)}</span><span>${esc(r.line)}</span></div>`
      ).join("") + `</div></div>`;
  }

  const { riders, missing } = gatherRiders(tier);
  if (riders.length) {
    const lbl = isAttack
      ? "On a hit — the attack roll is the only d20"
      : `On a failed ${esc((coreCog?.savingThrow || "").toLowerCase())} save — the only d20`;
    h += `<div class="c-sec"><div class="c-lbl">${lbl}</div>`;
    riders.forEach(e => {
      h += `<div class="c-row"><div class="c-src">${esc(e.name)}</div><div class="c-txt">${esc(cardLine(e.parts[0]))}` +
           e.parts.slice(1).map(p => `<span class="c-up">${esc(cardLine(p))}</span>`).join("") + `</div></div>`;
    });
    h += `</div>`;
  }
  if (missing.length)
    h += `<div class="c-sec"><div class="c-lbl">Not yet written</div><div class="c-txt">${esc(missing.join(", "))} has no ${esc(verumLabel().toLowerCase())} complement.</div></div>`;

  const foot = [];
  if (riders.length) foot.push("Sigil conditions last until the end of the target's next turn.");
  if (foot.length) h += `<div class="c-foot">${foot.join(" ")}</div>`;
  return h + `</div>`;
}

function buildFullRef(coreCog, tier) {
  const coreEntry = INDEX.find(c => c.id === state.core);
  const cd  = COMP_DATA[state.compType];
  const sub = cd.subtypes[state.compSub];

  const coreVerums  = coreCog?.verumEffects?.[verumKey()] || [];
  const activeVerum = coreVerums.find(v => v.name === state.coreVerum) || coreVerums[0];

  const scaleRow = sub.rows.find(r => r[0] === ORDINALS[state.slotLevel]);
  const scaleStr = scaleRow
    ? sub.columns.map((col, i) => `${col}: ${resolve(scaleRow[i])}`).join("  |  ")
    : "";

  const lines = [
    `ARCANUM VERITAS — ${ORDINALS[state.slotLevel].toUpperCase()} LEVEL SLOT · Char Lv ${state.charLevel}`,
    "═".repeat(52),
    `Composition  : ${cd.label} · ${state.compSub}${sub.shape ? ` · ${SHAPES[state.shape].label}` : ""}`,
    `Manner       : ${MANNERS[state.manner].label}${state.manner!=="standard" ? ` — ${MANNERS[state.manner].desc}` : ""}`,
    `Core         : ${coreEntry?.name}${state.complements.length
      ? `   |   Complements: ${state.complements.map(x=>INDEX.find(c=>c.id===x.id)?.name||x.id).join(", ")}`
      : ""}`,
    `Saving Throw : ${coreCog?.savingThrow || "—"}`,
    `Damage Type  : ${coreCog?.damageType  || "—"}`,
    `Tier         : ${TIERS[tier].label}`,
    `Numbers      : Prof ${sgn(profBonus())} · Attack ${sgn(sealAttack())} · Verum DC ${verumDC()}`,
    ``,
    `── SCALING (${ORDINALS[state.slotLevel]}) ──`,
    scaleStr,
    ``,
  ];
  // A Cognition that charges for its use says so before anything else it does
  if (coreCog?.cost) lines.push(`── COST ──`, resolve(partText(coreCog.cost)), ``);

  // Sigil dice that land on the seal's own roll, spelled out alongside the Ring's numbers
  const sig = sigilDamage(tier);
  if (sig.length) {
    lines.push(`── SIGIL DICE (added to the hit) ──`);
    sig.forEach(s => lines.push(`+${s.count}${s.die}${s.type ? ` ${s.type}` : ""} — ${s.source}`));
    lines.push(``);
  }

  if (activeVerum) {
    lines.push(`── CORE VERUM: ${(state.coreVerum || activeVerum.name).toUpperCase()} ──`);
    for (let i = 0; i <= tier; i++) {
      lines.push(`[${TIERS[i].label}] ${resolve(partText(activeVerum.tiers[i]))}`);
    }
    lines.push(``);
  }

  if (state.complements.length) {
    lines.push("── COMPLEMENT EFFECTS ──");
    state.complements.forEach(cs => {
      const cog   = LOADED[cs.id];
      const name  = INDEX.find(c => c.id === cs.id)?.name || cs.id;
      const avail = complementPool(cog);
      const activeFx = avail.find(fx => fx.name === cs.compEffect) || avail[0];
      if (activeFx) {
        lines.push(`${name} — ${activeFx.name}:`);
        lines.push(resolve(partText(activeFx.effect)));
        liveUpgrades(activeFx.upgrades, tier).forEach(u => lines.push(`  ↑ ${resolve(partText(u))}`));
      } else {
        lines.push(`${name}: No ${verumLabel()} complement defined.`);
      }
    });
  }

  if (sub.notes) {
    lines.push("");
    lines.push(`── RULES NOTE ──`);
    lines.push(sub.notes);
  }
  return lines;
}

// ═══════════════════════════════════════════════════════════
//  CODEX — one cognition, entire
// ═══════════════════════════════════════════════════════════
const VIEWS = { composer: "boardComposer", codex: "boardCodex", rings: "boardRings" };
const VIEW_TABS = { composer: "tabComposer", codex: "tabCodex", rings: "tabRings" };
function setView(v) {
  state.view = v;
  Object.entries(VIEWS).forEach(([k, id]) => document.getElementById(id).hidden = k !== v);
  Object.entries(VIEW_TABS).forEach(([k, id]) =>
    document.getElementById(id).className = "tab" + (k === v ? " on" : ""));
  if (v === "codex") {
    if (!state.codexId) {
      const first = state.core || (INDEX.find(c => c.ready) || {}).id;
      if (first) { openCodex(first); return; }
    }
    renderCodexList(); renderCodex();
  }
  if (v === "rings") {
    // Open on whatever the composer is already building, so the tabs stay in step
    if (!state.ringRef) state.ringRef = (state.compType && state.compSub)
      ? { type: state.compType, sub: state.compSub }
      : { type: "offensive", sub: "Direct Attack" };
    renderRingList(); renderRing();
  }
}

function renderCodexList() {
  const box = document.getElementById("codexList");
  if (!box) return;
  renderFilter("codexFilter");
  const q = (document.getElementById("codexSearch")?.value || "").trim().toLowerCase();
  const { shown, h } = groupedRail(q, c => {
    const on = state.codexId === c.id;
    return `<button class="cog ${on ? "core" : c.ready ? "" : "off"}" ${c.ready ? "" : "disabled"}
      onclick="openCodex('${escAttr(c.id)}')" title="${c.ready ? c.name : c.name + " — not written yet"}">
      <span class="ico">${cogIcon(c)}</span><span class="nm">${c.name}</span>
      ${c.favorite ? `<span class="cos" title="Player favourite — held to a higher power bar">★</span>` : ""}
      ${c.ready ? "" : `<span class="rl">soon</span>`}</button>`;
  });
  box.innerHTML = shown ? h : `<div class="empty" style="padding:22px 8px">${emptyRail(q)}</div>`;
}

async function openCodex(id) {
  const entry = INDEX.find(c => c.id === id);
  if (!entry || !entry.ready) return;
  await loadCognition(id);
  state.codexId = id;
  renderCodexList();
  renderCodex();
  document.getElementById("codexBody").scrollTop = 0;
}

// Which Rings actually draw on a given pool for this cognition — the fallback map made visible
function ringsUsing(cog, pool) {
  const out = [];
  Object.entries(COMP_DATA).forEach(([k, d]) => {
    const subs = Object.keys(d.subtypes).filter(sk => poolFor(cog, k, sk) === pool);
    if (!subs.length) return;
    out.push(subs.length === Object.keys(d.subtypes).length
      ? d.label
      : `${d.label} (${subs.join(", ")})`);
  });
  return out;
}

function renderCodex() {
  const host = document.getElementById("codexBody");
  if (!host) return;
  const entry = INDEX.find(c => c.id === state.codexId);
  const cog   = LOADED[state.codexId];
  if (!entry || !cog) {
    host.innerHTML = `<div class="empty">Pick a cognition from the left to read it in full.</div>`;
    return;
  }
  const tier = getTier(state.charLevel);
  const opp  = INDEX.find(c => c.id === cog.opposing);

  let h = `<div class="cdx">
    <div class="cdx-hd"><div class="cdx-ico">${cogIcon(entry)}</div><div>
      <h1>${esc(entry.name)}</h1>
      ${cog.description ? `<p class="cdx-desc">${esc(cog.description)}</p>` : ""}
      <div class="c-tags">
        ${catOf(entry) ? `<span class="t dom ${entry.category}">${esc(CATEGORIES[entry.category].label)}</span>` : ""}
        ${entry.favorite ? `<span class="t hot">★ player favourite</span>` : ""}
        ${cog.savingThrow ? `<span class="t">${esc(cog.savingThrow)} save</span>` : ""}
        ${cog.damageType  ? `<span class="t hot">${esc(cog.damageType)}</span>` : ""}
        ${opp ? `<span class="t">opposed by ${esc(opp.name)}</span>` : ""}
      </div>
    </div></div>`;

  // ── What using it costs, before what it does
  if (cog.cost) h += `<div class="cdx-sec"><h2>Cost of use</h2>
    <div class="cdx-note"><p>${esc(resolve(partText(cog.cost)))}</p></div></div>`;

  // ── Verum effects, pool by pool
  const POOLS = ["offensive","supportive","control","creation","utility"];
  let any = false;
  POOLS.forEach(pool => {
    const fx = cog.verumEffects?.[pool] || [];
    if (!fx.length) return;
    any = true;
    const d = COMP_DATA[pool];
    h += `<div class="cdx-sec"><h2 class="${d.color}">${d.icon} ${d.label} verum</h2>
      <p class="cdx-rings">Rings: ${esc(ringsUsing(cog, pool).join(" · ")) || "—"}</p>`;
    fx.forEach(e => {
      h += `<div class="cdx-fx"><div class="cdx-fx-h"><b>${esc(e.name)}</b>` +
           (e.description ? `<span>${esc(e.description)}</span>` : "") + `</div><div class="ladder">` +
        (e.tiers || []).map((t, i) =>
          `<div class="rung ${i === tier ? "now" : ""}"><span class="lv">${TIERS[i]?.label || ""}</span>
           <span>${esc(resolve(partText(t)))}</span></div>`).join("") + `</div></div>`;
    });
    h += `</div>`;
  });
  if (!any) h += `<p class="cdx-soon">No Verum effects written for ${esc(entry.name)} yet.</p>`;

  // ── Complement effects, grouped the same way
  const comps = cog.complementEffects || [];
  if (comps.length) {
    h += `<div class="cdx-sec"><h2>◆ Complement effects — as a Sigil</h2>
      <p class="cdx-rings">What ${esc(entry.name)} contributes to someone else's seal.</p></div>`;
    POOLS.forEach(pool => {
      const label = COMP_DATA[pool].label;
      const mine  = comps.filter(f => String(f.type).toLowerCase() === label.toLowerCase());
      if (!mine.length) return;
      h += `<div class="cdx-sec"><h2 class="${COMP_DATA[pool].color}">${label} sigil</h2>`;
      mine.forEach(f => {
        h += `<div class="cdx-fx"><div class="cdx-fx-h"><b>${esc(f.name)}</b>` +
             (f.description ? `<span>${esc(f.description)}</span>` : "") + `</div>
             <div class="cmp-b">${esc(resolve(partText(f.effect)))}` +
             (f.upgrades || []).map(u => `<span class="cdx-up">${esc(resolve(partText(u)))}</span>`).join("") +
             `</div></div>`;
      });
      h += `</div>`;
    });
  }

  host.innerHTML = h + `</div>`;
}

// ═══════════════════════════════════════════════════════════
//  RINGS — the composition tables, read on their own
// ═══════════════════════════════════════════════════════════
// What d20 the Ring asks for, if any — stated per Ring rather than inferred,
// because "not a Direct Attack" does not mean "somebody saves".
const RING_ROLL = {
  "offensive/Direct Attack": "seal attack roll",
  "offensive/Area":          "saving throw",
  "offensive/Field":         "saving throw",
  "offensive/Infusion":      "your weapon attack",
  "supportive/Self":         "no roll",
  "supportive/Ally":         "no roll",
  "supportive/Aura":         "no roll",
  "supportive/Ward":         "no roll — it absorbs",
  "control/Targeted":        "saving throw",
  "control/Area":            "saving throw",
  "creation/Structure":      "verum on touch",
  "creation/Construct":      "the construct's own attacks",
  "creation/Object":         "no roll",
  "utility/Utility":         "no roll",
};

function renderRingList() {
  const box = document.getElementById("ringList");
  const ref = state.ringRef || {};
  box.innerHTML = Object.entries(COMP_DATA).map(([k, d]) =>
    `<div class="rail-grp ${d.color}">${d.icon} ${d.label}</div>` +
    Object.keys(d.subtypes).map(sk => {
      const on = ref.type === k && ref.sub === sk;
      return `<button class="cog${on ? " core" : ""}" onclick="openRing('${k}','${escAttr(sk)}')">
        <span class="nm">${sk}</span></button>`;
    }).join("")
  ).join("");
}

function openRing(type, sub) {
  state.ringRef = { type, sub };
  renderRingList(); renderRing();
  document.getElementById("ringBody").scrollTop = 0;
  // Keep the rail on the selection — stacked, it is a 190px window over fourteen Rings
  document.querySelector("#ringList .cog.core")?.scrollIntoView({ block: "nearest" });
}
// Jumping the slot from a table row keeps the whole tool on that slot (renderMain redraws here)
function ringSlot(n) { bumpSlotTo(n); }

function renderRing() {
  const host = document.getElementById("ringBody");
  if (!host) return;
  const ref = state.ringRef;
  const d   = ref && COMP_DATA[ref.type];
  const sub = d && d.subtypes[ref.sub];
  if (!sub) { host.innerHTML = `<div class="empty">Pick a Ring from the left.</div>`; return; }

  // Where this Ring's Verum effects come from, in general and for the Core in play
  const fallback = sub.verumKey || d.verumKey || ref.type;
  const coreCog  = LOADED[state.core];
  const live     = coreCog ? poolFor(coreCog, ref.type, ref.sub) : null;

  let tags = "";
  if (sub.reaction)      tags += `<span class="t hot">reaction</span>`;
  if (sub.concentration) tags += `<span class="t hot">concentration</span>`;
  // Worth saying only where a sibling Ring in the same family does concentrate — there it is a choice
  else if (Object.values(d.subtypes).some(s => s.concentration))
    tags += `<span class="t">no concentration</span>`;
  if (sub.saveDisadvantage) tags += `<span class="t hot">first save at disadvantage</span>`;
  if (sub.shape)         tags += `<span class="t">sphere · cone · line</span>`;
  const roll = RING_ROLL[`${ref.type}/${ref.sub}`];
  if (roll) tags += `<span class="t">${esc(roll)}</span>`;
  if (fallback !== ref.type)
    tags += `<span class="t">borrows the ${esc(COMP_DATA[fallback].label)} pool</span>`;

  let h = `<div class="cdx">
    <div class="cdx-hd"><div class="cdx-ico">${d.icon}</div><div>
      <h1>${esc(ref.sub)}</h1>
      <p class="cdx-desc">${esc(d.label)} — ${esc(d.desc)}</p>
      <div class="c-tags">${tags}</div>
    </div></div>`;

  // ── Which pool fills it
  h += `<div class="cdx-sec"><h2 class="${d.color}">Verum pool</h2>
    <p class="cdx-rings">A Cognition's own <strong>${esc(d.label)}</strong> effects fill this Ring` +
    (fallback !== ref.type
      ? `, and when it has none written, this Ring falls back to its <strong>${esc(COMP_DATA[fallback].label)}</strong> pool.`
      : `.`) +
    (live ? ` For <strong>${esc(INDEX.find(c => c.id === state.core)?.name || "")}</strong>,
        the Core you have selected, it resolves to <strong>${esc(COMP_DATA[live].label)}</strong>.` : ``) +
    `</p></div>`;

  // ── The whole table, every slot, the live one lit
  h += `<div class="cdx-sec"><h2 class="${d.color}">Scaling — all nine slots</h2>
    <p class="cdx-rings">Click a row to set the tool to that slot. Formulas resolve against your Verum mod.</p>
    <div class="tbl-wrap"><table class="tbl"><thead><tr>` +
    sub.columns.map(c => `<th>${esc(c)}</th>`).join("") + `</tr></thead><tbody>` +
    sub.rows.map(r => {
      const n = ORDINALS.indexOf(r[0]);
      return `<tr class="${n === state.slotLevel ? "now" : ""}" onclick="ringSlot(${n})">` +
        r.map((cellv, i) => `<td${String(cellv).length > 40 ? ' class="wrap"' : ""}>${esc(resolve(cellv))}</td>`).join("") +
        `</tr>`;
    }).join("") + `</tbody></table></div></div>`;

  // ── How it resolves at the table
  if (sub.notes) {
    h += `<div class="cdx-sec"><h2 class="${d.color}">How it resolves</h2>
      <div class="cdx-note">` + sub.notes.split(/\n+/).map(p => `<p>${esc(p)}</p>`).join("") + `</div></div>`;
  }

  // ── Shapes, only where a radius exists to shape
  if (sub.shape) {
    h += `<div class="cdx-sec"><h2 class="${d.color}">Shape</h2><div class="cdx-defs">` +
      Object.values(SHAPES).map(s =>
        `<div class="cdx-def"><b>${esc(s.label)}</b><span>${esc(s.desc)}</span></div>`).join("") +
      `</div></div>`;
  }

  // ── Manners, with the ones this Ring forbids struck out
  h += `<div class="cdx-sec"><h2 class="${d.color}">Manner of drawing</h2><div class="cdx-defs">` +
    Object.entries(MANNERS).map(([k, m]) => {
      const ok = mannerAllowed(k, ref.sub);
      return `<div class="cdx-def${ok ? "" : " dis"}"><b>${esc(m.label)}</b>
        <span>${ok ? esc(m.desc) : `Not available to ${esc(ref.sub)}.`}</span></div>`;
    }).join("") + `</div></div>`;

  // ── The rest of the family, one click away
  const siblings = Object.keys(d.subtypes).filter(s => s !== ref.sub);
  if (siblings.length) {
    h += `<div class="cdx-sec"><h2 class="${d.color}">Also ${esc(d.label)}</h2><div class="chips">` +
      siblings.map(s => `<button class="chip" onclick="openRing('${ref.type}','${escAttr(s)}')">${esc(s)}</button>`).join("") +
      `</div></div>`;
  }

  host.innerHTML = h + `</div>`;
}

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function copySum() {
  const el = document.getElementById("sumBody");
  if (!el) return;
  const txt = el.dataset.text ? el.dataset.text.replace(/&quot;/g, '"') : el.textContent;
  navigator.clipboard.writeText(txt).then(() => toast("Copied to clipboard"));
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

// ═══════════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════════
// ── Bar inputs ─────────────────────────────────────────────
["vmInput","dsInput"].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("input", e => {
    const v = parseInt(e.target.value, 10);
    state[id === "vmInput" ? "verumMod" : "dreamMod"] = isNaN(v) ? 0 : v;
    syncBar(); renderMain();
  });
});
// Keyboard: arrows nudge slot, shift+arrows nudge level
document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") { e.shiftKey ? bumpLvl(1)  : bumpSlot(1);  }
  else if (e.key === "ArrowLeft") { e.shiftKey ? bumpLvl(-1) : bumpSlot(-1); }
});

// ═══════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════
boot();
</script>
</body>
</html>
