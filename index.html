<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcanum Veritas — Seal Composer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Cognition icons. If this can't load, the emoji in index.json are used instead. -->
<link id="faCss" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="bar">
  <div class="brand">Arcanum Veritas<em>seal composer</em></div>
  <button class="mode" id="modeBtn" onclick="toggleMode()" title="Switch between Arcanum Veritas and the Ignition system">⇄ Ignition</button>
  <div class="tabs">
    <button class="tab on" id="tabComposer" onclick="setView('composer')">Composer</button>
    <button class="tab" id="tabCodex" onclick="setView('codex')">Codex</button>
    <button class="tab" id="tabRings" onclick="setView('rings')">Rings</button>
    <button class="tab" id="tabDamage" onclick="setView('damage')">Damage</button>
    <button class="tab" id="tabEmotion" onclick="setView('emotion')">Emotion</button>
  </div>
  <div class="dials">
    <div class="dial" id="slotDial"><label for="slotDn">Slot</label>
      <div class="step"><button id="slotDn" onclick="bumpSlot(-1)" aria-label="Lower slot">–</button><span id="slotVal">1st</span><button onclick="bumpSlot(1)" aria-label="Raise slot">+</button></div>
    </div>
    <div class="dial"><label for="lvlDn">Level</label>
      <div class="step"><button id="lvlDn" onclick="bumpLvl(-1)" aria-label="Lower level">–</button><span id="lvlVal">1</span><button onclick="bumpLvl(1)" aria-label="Raise level">+</button></div>
    </div>
    <div class="dial" id="vmDial"><label for="vmInput">Verum mod</label><input class="num" type="number" id="vmInput" value="4" min="-2" max="12"></div>
    <div class="dial" id="physDial" hidden><label for="pmInput" title="Your highest Strength, Dexterity or Constitution modifier">Physical mod</label><input class="num" type="number" id="pmInput" value="3" min="-2" max="12"></div>
    <div class="dial"><label for="dsInput">Dream mod</label><input class="num" type="number" id="dsInput" value="0" min="-2" max="12"></div>
  </div>
  <div class="live">
    <span class="lv atk"><b id="atkOut">+3</b><i>to hit</i></span>
    <span class="lv dc"><b id="dcOut">13</b><i>Verum DC</i></span>
    <span class="lv"><b id="capOut">1</b><i id="capLbl">cognition</i></span>
    <span class="status" id="statusEl">Loading…</span>
  </div>
</div>

<div class="board" id="boardComposer">
  <aside class="rail">
    <div class="rail-top">
      <select class="pick" id="cogFilter" aria-label="Filter by domain" onchange="setFilter(this.value || null)"></select>
      <input class="search" id="cogSearch" type="search" placeholder="Search cognitions" oninput="renderCogList()">
    </div>
    <div class="cogs" id="cogList"></div>
    <div class="rail-foot"><button class="ghost" onclick="clearAll()">Clear selection</button></div>
  </aside>

  <section class="composer" id="composer"></section>

  <section class="seal">
    <div class="seal-h">
      <h2 id="sealTitle">The seal</h2>
      <button class="mini on" id="mPlay" onclick="setSumMode('play')">Play</button>
      <button class="mini" id="mFull" onclick="setSumMode('full')">Full</button>
      <button class="mini" onclick="rollSeal()" title="Roll the seal's dice — every damage and healing number, added up (R)">Roll</button>
      <button class="mini" onclick="rollSeal(true)" title="Roll it as a critical hit — double dice (shift+R, or shift-click a chip)">Crit</button>
      <button class="mini" onclick="copySum()">Copy</button>
      <button class="mini" onclick="saveImage()" title="Save this card as a PNG — on a phone, it opens the share sheet">Image</button>
      <button class="mini" onclick="window.print()">Print</button>
    </div>
    <div id="sumBody"></div>
    <div id="tray" class="tray" hidden></div>
  </section>
</div>

<div class="board" id="boardCodex" hidden>
  <aside class="rail">
    <div class="rail-top">
      <select class="pick" id="codexFilter" aria-label="Filter by domain" onchange="setFilter(this.value || null)"></select>
      <input class="search" id="codexSearch" type="search" placeholder="Search cognitions" oninput="renderCodexList()">
    </div>
    <div class="cogs" id="codexList"></div>
    <div class="rail-foot"><button class="ghost" onclick="window.print()">Print entry</button></div>
  </aside>
  <section class="codex" id="codexBody"></section>
</div>

<div class="board" id="boardDamage" hidden>
  <aside class="rail">
    <div class="cogs" id="damageList" style="padding-top:11px"></div>
    <div class="rail-foot"><button class="ghost" onclick="window.print()">Print</button></div>
  </aside>
  <section class="codex" id="damageBody"></section>
</div>

<div class="board" id="boardEmotion" hidden>
  <aside class="rail">
    <div class="cogs" id="emoList" style="padding-top:11px"></div>
    <div class="rail-foot"><button class="ghost" onclick="window.print()">Print</button></div>
  </aside>
  <section class="codex" id="emoBody"></section>
</div>

<div class="board" id="boardRings" hidden>
  <aside class="rail">
    <div class="cogs" id="ringList" style="padding-top:11px"></div>
    <div class="rail-foot"><button class="ghost" onclick="window.print()">Print ring</button></div>
  </aside>
  <section class="codex" id="ringBody"></section>
</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/rail.js"></script>
<script src="js/composer.js"></script>
<script src="js/card.js"></script>
<script src="js/codex.js"></script>
<script src="js/rings.js"></script>
<script src="js/damage.js"></script>
<script src="js/emotion.js"></script>
<script src="js/ignition.js"></script>
<script src="js/dice.js"></script>
<script src="js/events.js"></script>
</body>
</html>
