<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library — Ephemer</title>
<meta name="description" content="Once Upon a Star ★ — the campaign's shared documents, published from the vault.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css?v=2026-10-28b">
<!-- The tool strip, shared with the rest of Ephemer. In <head> so its styling lands before the
     bar is first painted; ../js/ because it lives at the app root, not in this section. -->
<script src="../js/tools.js?v=2026-10-28b"></script>
<style>
  /* This section is one frame and nothing else, so it takes the whole viewport under the bar
     rather than scrolling a page that contains a scrolling page. */
  html,body{height:100%}
  body{margin:0;overflow:hidden;background:var(--slate)}
  .lib-bar{position:sticky;top:0;z-index:40}
  .lib-wrap{height:calc(100dvh - var(--lib-bar, 57px));position:relative}
  /* `position` and a z-index on the FRAME, not just on the fallback: a positioned element paints
     over a static one whatever its z-index, so without this the fallback showed through the site. */
  .lib-frame{position:relative;z-index:1;display:block;width:100%;height:100%;border:0;
    background:var(--slate)}
  /* Behind the frame, so it is what you are looking at if the frame never paints — a changed
     header at the far end, a blocked third party, no network. The frame covers it when it loads. */
  .lib-fallback{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;gap:10px;
    align-items:center;justify-content:center;text-align:center;padding:24px;
    font-family:var(--sans);font-size:13px;color:var(--mute)}
  .lib-fallback a{color:var(--brass)}
  .lib-out{font-family:var(--sans);font-size:11px;color:var(--mute);text-decoration:none;
    border:1px solid var(--line);border-radius:6px;padding:4px 9px;white-space:nowrap}
  .lib-out:hover{color:var(--bone);border-color:var(--mute)}

  /* ── the copy-link button ──────────────────────────────────────────────
     It sits OVER the frame rather than in the bar, because the bar already carries "Open in a new
     tab" and two links a hand's width apart read as one choice. Over the frame it reads as a thing
     you do to what you are looking at.

     `pointer-events:none` on the layer and `auto` on the button: the layer spans the frame only to
     POSITION the button, and lets every pointer through. Only the button's own 88x29 takes the
     mouse — without that, the top corner of the Library would be dead to it. */
  .lib-copy-layer{position:absolute;inset:0;z-index:2;pointer-events:none}
  .lib-copy{position:absolute;top:10px;right:14px;pointer-events:auto;
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--sans);font-size:11px;color:var(--mute);
    background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    padding:5px 10px;cursor:pointer;white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
    opacity:.34;transition:opacity .13s ease,color .13s,border-color .13s}
  /* ⚠️ IT RESTS AT .34 RATHER THAN 0, AND THAT IS NOT TIMIDITY — IT IS THE IFRAME.
     A cross-origin frame takes the pointer the moment it enters, and the parent page's `:hover`
     does not follow it in: `.lib-wrap:hover` never fires while you are reading. A button hidden at
     0 and revealed by hovering the frame would therefore be invisible and unreachable, every time.
     So it rests faint over the Library's own margin and comes up full when the pointer reaches IT
     — which is the same gesture, triggered by the only element that can still feel one. */
  .lib-copy:hover,.lib-copy:focus-visible{opacity:1;color:var(--bone);border-color:var(--mute)}
  .lib-copy.done{opacity:1;color:var(--brass);border-color:var(--brass)}
  /* A pointer that cannot hover never earns the bright state, so a touch screen gets it outright. */
  @media (hover:none){.lib-copy{opacity:1}}
  @media (prefers-reduced-motion:reduce){.lib-copy{transition:none}}
</style>
</head>
<body>

<div class="bar lib-bar">
  <nav class="tools" data-tool="library" aria-label="Ephemer tools"></nav>
  <div class="brand">
    <a href="./">Library</a><em>once upon a star</em>
  </div>
  <span class="sp" style="flex:1"></span>
  <!-- Always present, whatever the frame does: the site has its own search, its own graph and its
       own deep links, and some of that is simply better in a tab of its own. -->
  <a class="lib-out" href="https://publish.obsidian.md/once-upon-a-star" target="_blank"
     rel="noopener noreferrer">Open in a new tab ↗</a>
</div>

<div class="lib-wrap">
  <div class="lib-fallback">
    <p><b>The Library did not load.</b></p>
    <p>It is published from the vault and lives at
      <a href="https://publish.obsidian.md/once-upon-a-star" target="_blank" rel="noopener noreferrer">publish.obsidian.md/once-upon-a-star</a>
      — open it there.</p>
  </div>
  <!-- No `sandbox`: a cross-origin frame is already walled off by the same-origin policy, and a
       partial sandbox would only break the site's own scripts without making this any safer. -->
  <iframe class="lib-frame" title="Once Upon a Star ★ — the campaign's shared documents"
          src="https://publish.obsidian.md/once-upon-a-star"
          referrerpolicy="no-referrer"
          allow="clipboard-write"></iframe>
  <!-- Over the frame, not in it: this is OUR button on OUR page. The layer is click-through so
       only the button itself takes the mouse. -->
  <div class="lib-copy-layer">
    <button class="lib-copy" id="libCopy" type="button"
            title="Copy the Library's address — publish.obsidian.md/once-upon-a-star">
      <span aria-hidden="true">⧉</span><span class="lib-copy-t">Copy link</span>
    </button>
  </div>
</div>

<script>
  // The bar's height is whatever the shared stylesheet makes it, and it WRAPS on a narrow screen —
  // so the frame is told rather than guessing with a magic number that is wrong at 375px.
  //
  // A ResizeObserver rather than a load handler and a resize listener: the bar also changes height
  // when the web font arrives and when the tool strip's second render adds the DM's rows, and
  // measuring once at parse time caught none of that — the page scrolled by the 34px difference.
  const bar = document.querySelector(".lib-bar");
  const fit = () => document.documentElement.style.setProperty("--lib-bar", bar.offsetHeight + "px");
  fit();
  new ResizeObserver(fit).observe(bar);

  // ── Copy link ─────────────────────────────────────────────────────────
  // The address is READ from the bar's own link rather than written here a fifth time. It already
  // appears in the iframe's src, the fallback and that link; a copy button that is a fifth copy is
  // a fifth thing to forget when the vault is republished under another name.
  //
  // ⚠️ It is deliberately the LIBRARY'S address and not the note being read: this frame is
  // cross-origin, so the page can never be told which note is open — `contentWindow.location`
  // throws. Anyone who wants to link one note deep uses Obsidian's own copy-link inside the frame.
  const copy = document.getElementById("libCopy");
  const label = copy.querySelector(".lib-copy-t");
  const href = document.querySelector(".lib-out").href;
  let back;

  const say = (text, ok) => {
    clearTimeout(back);
    label.textContent = text;
    copy.classList.toggle("done", !!ok);
    back = setTimeout(() => { label.textContent = "Copy link"; copy.classList.remove("done"); }, 1800);
  };

  // The last resort, when the browser will not hand over the clipboard at all: put the address on
  // screen, selected, where the button was. One ctrl+C and it is yours.
  //
  // ⚠️ NOT `window.prompt`, which was the first thing written here and threw outright —
  // "prompt() is not supported" — in the very browser used to test it. A fallback that raises an
  // exception is worse than no fallback: it fails silently to the reader and loudly to nobody.
  const offerToCopy = () => {
    const field = document.createElement("input");
    field.className = "lib-copy";
    field.value = href;
    field.readOnly = true;
    field.style.cssText = "width:min(320px,60vw);opacity:1;cursor:text";
    field.addEventListener("blur", () => { field.remove(); copy.hidden = false; }, { once: true });
    copy.hidden = true;
    copy.parentNode.appendChild(field);
    field.focus();
    field.select();
  };

  copy.addEventListener("click", async () => {
    // `writeText` needs a real click behind it, so this only ever runs from one.
    try {
      await navigator.clipboard.writeText(href);
      return say("Copied", true);
    } catch { /* an insecure origin, a refused permission, or an older browser */ }

    try {
      const field = document.createElement("input");
      field.value = href;
      field.readOnly = true;
      field.style.cssText = "position:fixed;top:-100px;left:0;opacity:0";
      document.body.appendChild(field);
      field.select();
      const done = document.execCommand && document.execCommand("copy");
      field.remove();
      if (done) return say("Copied", true);
    } catch { /* execCommand is gone in newer browsers; fall through */ }

    say("Press ctrl+C");
    offerToCopy();
  });
</script>

</body>
</html>
